name: 24/7 Autonomous Bounty Sniper

on:
  schedule:
    # Overlapping 10-minute cron cycles in GitHub's high-speed cloud datacenter (24/7 continuous uptime)
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: bounty-hunter-singleton
  cancel-in-progress: true

jobs:
  bounty-sniper:
    name: ⚡ High-Frequency Bounty Sniper (Asad Lee)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run High-Frequency Bounty Sniper (Continuous Cloud Loop)
        env:
          TELEGRAM_CHAT_ID: '7080909965'
          TELEGRAM_BOT_TOKEN: '8814701073:AAF2gj_wL-37JyJoqA_2vTDSdPN5NwFKXI0'
          SOLVER_SEED: ${{ secrets.SOLVER_SEED || secrets.TECHNOCORE_SEED }}
        run: |
          echo "============================================================"
          echo "🚀 STARTING HIGH-FREQUENCY BOUNTY SNIPER (ASAD LEE)"
          echo "Network: 15ms Azure Cloud Datacenter | Dual-Stream Polling"
          echo "============================================================"
          # Run continuous dual-stream keep-alive sniper for 20 minutes (1200 seconds)
          node sniper.mjs 20

      - name: 🔄 Auto-Chain Next 24/7 Cloud Runner Cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Requesting next cloud runner cycle..."
          gh workflow run bounty_hunter.yml --ref main || true

      - name: Fallback Ping to Vercel Auto-Hunt
        if: always()
        run: |
          echo "Dispatched auxiliary pulse to Vercel..."
          curl -s -X GET "https://technocore-console.vercel.app/api/auto-hunt" || true
