name: 24/7 Autonomous Bounty Hunter

on:
  schedule:
    # Trigger every 5 minutes in the GitHub cloud
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bounty-hunt:
    name: Scan & Solve Live Bounties
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Vercel Auto-Hunt Engine
        run: |
          echo "Triggering 24/7 Bounty Hunter on Vercel..."
          RESPONSE=$(curl -s -X GET "https://technocore-console.vercel.app/api/auto-hunt")
          echo "Response: $RESPONSE"
